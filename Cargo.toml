[package]
name = "bfloginauth"
version = "0.1.0-alpha.3"
edition = "2024"
description = "Small OAuth2-style login server (authorization code + PKCE, EdDSA JWT, refresh token rotation) for nginx"
license = "MIT"
authors = ["Benjamin Benno Falkner"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
humantime-serde = "1"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = true
strip = true
