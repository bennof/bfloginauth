#
# Push a tag like v0.1.0 to build static Linux binaries and publish a release.
# All actions run on Node 24 (dtolnay/rust-toolchain is a composite action).

name: release

on:
  push:
    tags: ["v*"]
  # Manual test run: builds and uploads the archives as artifacts, no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist/bfloginauth
          cp target/${{ matrix.target }}/release/bfloginauth dist/bfloginauth/
          cp -r Makefile LICENSE README.md examples nginx dist/bfloginauth/
          tar -C dist -czf dist/bfloginauth-${{ matrix.arch }}-linux.tar.gz bfloginauth
          (cd dist && sha256sum bfloginauth-${{ matrix.arch }}-linux.tar.gz > bfloginauth-${{ matrix.arch }}-linux.tar.gz.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: bfloginauth-${{ matrix.arch }}
          path: dist/bfloginauth-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Tags with a hyphen (v0.1.0-alpha.1) become pre-releases.
      - run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $flags
        env:
          GH_TOKEN: ${{ github.token }}
