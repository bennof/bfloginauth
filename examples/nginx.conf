# Example: bfloginauth behind nginx (complete config, no snippets).
# bfloginauth listens on 127.0.0.1:8080, issuer = "https://example.com/login".

limit_req_zone $binary_remote_addr zone=bfloginauth:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name example.com;
    # ssl_certificate     ...;
    # ssl_certificate_key ...;

    # Login server
    location = /login/authorize {
        limit_req zone=bfloginauth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/authorize;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login/verify {
        return 404;
    }

    # Internal token check. Empty $bfloginauth_roles = any valid token.
    # Do not set it at server level: that would also run in this subrequest and clear the roles.
    location = /login/_auth-verify {
        internal;
        set $bfloginauth_roles $bfloginauth_roles;
        uninitialized_variable_warn off;
        proxy_pass http://127.0.0.1:8080/verify?role=$bfloginauth_roles;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Protected: any valid token, user name passed on to the backend
    location /api/ {
        set $bfloginauth_roles "";
        auth_request /login/_auth-verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-User $auth_user;
        proxy_pass http://127.0.0.1:9000/;
    }

    # Protected: valid token and role teacher or admin
    location /teacher/ {
        set $bfloginauth_roles "teacher,admin";
        auth_request /login/_auth-verify;
        proxy_pass http://127.0.0.1:3000/;
    }
}

# Another server only needs the internal token check.
server {
    listen 443 ssl;
    server_name app.example.com;

    location = /login/_auth-verify {
        internal;
        set $bfloginauth_roles $bfloginauth_roles;
        uninitialized_variable_warn off;
        proxy_pass http://127.0.0.1:8080/verify?role=$bfloginauth_roles;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        set $bfloginauth_roles "admin";
        auth_request /login/_auth-verify;
        proxy_pass http://127.0.0.1:9100/;
    }
}
