# bfloginauth-login-server.conf: proxy requests to the login server.

# Needs bfloginauthzone.conf (deploy/nginx/conf.d/) in /etc/nginx/conf.d/.
location = /login/authorize {
    limit_req zone=bfloginauth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080/authorize;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /login/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /login/verify {
    return 404;
}
