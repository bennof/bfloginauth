#
# bfloginauth-verify-endpoint.conf: internal token check. Include once per server {}.

# Empty $bfloginauth_roles = any valid token.
# Do not set it at server level: that would also run in this subrequest and clear the roles.
location = /login/_auth-verify {
    internal;
    set $bfloginauth_roles $bfloginauth_roles;
    uninitialized_variable_warn off;
    # CORS preflight carries no token: let it through to the backend.
    # $request_method is the method of the original request here.
    if ($request_method = OPTIONS) {
        return 204;
    }
    proxy_pass http://127.0.0.1:8080/verify?role=$bfloginauth_roles;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
